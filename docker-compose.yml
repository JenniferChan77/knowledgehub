services:
  db:
    image: postgres:17-alpine
    container_name: knowledge-hub-db
    environment:
      POSTGRES_USER: knowledge_hub
      POSTGRES_PASSWORD: knowledge_hub
      POSTGRES_DB: knowledge_hub
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U knowledge_hub -d knowledge_hub']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
